<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendar · VenvLearning</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/family.css?v=ui-20261020">
<link rel="stylesheet" href="/brand.css?v=brand-5">
<link rel="stylesheet" href="/lms.css?v=lms-6">
</head>
<body>
<header class="topbar">
  <div>
    <p class="eyebrow">FAMILY HOMESCHOOL</p>
    <h1>Calendar</h1>
  </div>
  <nav></nav>
</header>
<main class="lms-dash">
  <div class="lms-dash-head">
    <div class="lms-toolbar">
      <button type="button" id="calPrev" class="secondary" aria-label="Previous month">‹</button>
      <h2 id="calTitle" aria-live="polite"></h2>
      <button type="button" id="calNext" class="secondary" aria-label="Next month">›</button>
      <button type="button" id="calToday" class="secondary">Today</button>
    </div>
    <div class="lms-toolbar"><span id="lmsSwitch"></span><button type="button" id="calIcs" class="secondary">Download .ics</button></div>
  </div>
  <p id="status" role="status" class="family-status">Loading…</p>
  <div class="cal-layout">
    <div id="calGrid" class="cal-grid" role="grid" aria-labelledby="calTitle"></div>
    <aside id="calDetail" class="card cal-detail" aria-live="polite"></aside>
  </div>
</main>
<script src="/lms.js?v=lms-5" defer></script>
<script src="/calendar.js?v=lms-5" defer></script>
<script src="/account-nav.js?v=lms-5" defer></script>
<script src="/ux.js?v=ux-1" defer></script>
</body>
</html>
