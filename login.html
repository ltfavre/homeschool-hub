<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family sign in · VenvLearning</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/family.css"></head><body><main class="login-wrap"><p class="eyebrow">FAMILY HOMESCHOOL</p><h1>Welcome to VenvLearning</h1><p id="intro">Sign in to open your planner or today's school agenda.</p><form id="loginForm" class="card"><label id="usernameLabel">Email or student username<input id="username" autocomplete="username" required maxlength="200"></label><label><span id="passwordLabel">Password</span><input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><label id="confirmLabel" hidden>Confirm your new password<input id="confirm" type="password" autocomplete="new-password" maxlength="256"></label><button id="submit" type="submit">Sign in</button><p id="message" role="status"></p></form><p class="muted">Children: use the username and password your parent prepared. Parents: use your one-time setup link first. Daily activities are organized on the website; no daily emails are sent.</p></main><script src="/login.js?v=family-v1" defer></script></body></html>
