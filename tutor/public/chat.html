<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Tutor</title>
<style>
:root{--hunter:#234638;--forest:#142B23;--ink:#171717;--ivory:#FAF7F2;--rose:#F5E5E5;--blush:#E8BFC4;--gold:#D4AF37;--sage-wash:#EEF2EA;--muted:#5F5B56;--line:#E6DFD2;
  --font:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;--size:17px}
body.g4{--size:20px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ivory);color:var(--ink);font-family:var(--font);font-size:var(--size)}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--hunter);color:#fff}
header h1{margin:0;font-size:1.15em;font-weight:600}
header small{opacity:.8;font-weight:400}
button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid transparent}
#new{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);padding:6px 14px;font-size:.85em}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(720px,88%);padding:12px 16px;border-radius:16px;line-height:1.5;white-space:normal;overflow-wrap:anywhere}
.msg p{margin:.2em 0 .6em}.msg p:last-child{margin-bottom:0}.msg ul,.msg ol{margin:.2em 0 .6em;padding-left:1.4em}
.student{align-self:flex-end;background:var(--hunter);color:#fff;border-bottom-right-radius:4px}
.tutor{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.error{align-self:center;background:var(--rose);color:#7a2430;font-size:.9em}
.status{align-self:flex-start;color:var(--muted);font-size:.85em;font-style:italic;padding:0 6px}
.hello{align-self:center;text-align:center;color:var(--muted);max-width:560px;margin-top:8vh}
.hello h2{color:var(--hunter);font-weight:600;margin:.2em 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chips button{background:var(--sage-wash);color:var(--forest);border-color:#cfdac8;padding:8px 14px;font-size:.9em}
form{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
textarea{flex:1;font:inherit;resize:none;border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:48px;max-height:30vh;background:var(--ivory)}
textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
#send{background:var(--hunter);color:#fff;padding:0 22px;font-weight:600}
#send:disabled{opacity:.5;cursor:default}
.dots::after{content:'…';animation:d 1.2s steps(4) infinite}@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
</style>
</head>
<body>
<header><h1>📚 My Tutor <small id="who"></small></h1><button id="new" type="button">New chat</button></header>
<main id="log" aria-live="polite"></main>
<form id="f"><textarea id="t" rows="1" placeholder="Ask me about your schoolwork…" aria-label="Your message"></textarea><button id="send">Send</button></form>
<script>
const token = location.pathname.split('/').pop();
const api = (p, o = {}) => fetch(p, {...o, headers: {'x-tutor-key': token, 'content-type': 'application/json', ...(o.headers || {})}});
const log = document.getElementById('log'), t = document.getElementById('t'), send = document.getElementById('send');
const today = new Date().toDateString(), storeKey = 'tutor-conv-' + token.slice(0, 8);
let conv = null, me = {name: '', grade: 0};
try { const s = JSON.parse(localStorage.getItem(storeKey) || 'null'); if (s && s.day === today) conv = s.id; } catch {}

const esc = s => s.replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
function md(text) {   // small, safe markdown: paragraphs, lists, **bold**, *italic*
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  const out = []; let list = null;
  for (const line of text.split('\n')) {
    const ul = /^\s*[-•*]\s+(.*)/.exec(line), ol = /^\s*\d+[.)]\s+(.*)/.exec(line);
    const kind = ul ? 'ul' : ol ? 'ol' : null;
    if (kind) { if (!list || list.kind !== kind) { if (list) out.push(`</${list.kind}>`); list = {kind}; out.push(`<${kind}>`); } out.push(`<li>${inline((ul || ol)[1])}</li>`); continue; }
    if (list) { out.push(`</${list.kind}>`); list = null; }
    if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push(`</${list.kind}>`);
  return out.join('');
}
function bubble(role, text) {
  const d = document.createElement('div'); d.className = 'msg ' + role;
  if (role === 'tutor') d.innerHTML = md(text); else d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function hello() {
  log.innerHTML = '';
  const h = document.createElement('div'); h.className = 'hello';
  h.innerHTML = `<h2>Hi${me.name ? ', ' + esc(me.name) : ''}! 👋</h2><p>I'm your tutor. I know your lessons, readings, and what's due. Ask me anything about your schoolwork!</p><div class="chips"></div>`;
  const chips = me.grade == 4
    ? ["What do I have today?", "Help me with my math lesson", "Help me understand my reading", "Quiz me on this week's words"]
    : ["What's due this week?", "Help me study for my next check", "Explain today's math lesson", "Help me plan my writing"];
  for (const c of chips) { const b = document.createElement('button'); b.type = 'button'; b.textContent = c; b.onclick = () => ask(c); h.querySelector('.chips').appendChild(b); }
  log.appendChild(h);
}
async function ask(text) {
  text = text.trim(); if (!text || send.disabled) return;
  if (log.querySelector('.hello')) log.innerHTML = '';
  bubble('student', text); t.value = ''; grow(); send.disabled = true;
  const status = document.createElement('div'); status.className = 'status dots'; status.textContent = 'Thinking'; log.appendChild(status);
  let reply = null, acc = '';
  try {
    const res = await fetch('/api/chat', {method: 'POST', headers: {'x-tutor-key': token, 'content-type': 'application/json'}, body: JSON.stringify({conversation_id: conv, message: text})});
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream: true});
      let i; while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith('data: ')) continue;
        const e = JSON.parse(line.slice(6));
        if (e.type === 'start') { conv = e.conversation_id; try { localStorage.setItem(storeKey, JSON.stringify({id: conv, day: today})); } catch {} }
        else if (e.type === 'status') { status.textContent = e.text.replace(/…$/, ''); }
        else if (e.type === 'text') { acc += e.delta; if (!reply) reply = bubble('tutor', ''); reply.innerHTML = md(acc); log.appendChild(status); log.scrollTop = log.scrollHeight; }
        else if (e.type === 'error') { bubble('error', e.text); }
      }
    }
  } catch (err) { bubble('error', 'I couldn\'t reach the tutor. Is the computer on? (' + err.message + ')'); }
  status.remove(); send.disabled = false; t.focus();
}
function grow() { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, innerHeight * 0.3) + 'px'; }
t.addEventListener('input', grow);
t.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(t.value); } });
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); ask(t.value); });
document.getElementById('new').onclick = () => { conv = null; try { localStorage.removeItem(storeKey); } catch {} hello(); t.focus(); };
(async () => {
  try { me = await (await api('/api/me')).json(); } catch {}
  document.getElementById('who').textContent = me.name ? `· ${me.name}` : '';
  if (me.grade == 4) document.body.classList.add('g4');
  if (conv) {
    const r = await api('/api/conversation/' + conv);
    if (r.ok) { const c = await r.json(); if (c.transcript.length) { for (const m of c.transcript) bubble(m.role === 'student' ? 'student' : m.role === 'tutor' ? 'tutor' : 'error', m.text); return; } }
    conv = null;
  }
  hello();
})();
</script>
</body>
</html>
