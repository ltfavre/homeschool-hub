<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard · VenvLearning</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/family.css?v=ui-20261020">
<link rel="stylesheet" href="/brand.css?v=brand-5">
<link rel="stylesheet" href="/lms.css?v=lms-3">
</head>
<body>
<header class="topbar">
  <div>
    <p class="eyebrow">FAMILY HOMESCHOOL</p>
    <h1>Dashboard</h1>
  </div>
  <nav></nav>
</header>
<main class="lms-dash">
  <div class="lms-dash-head">
    <div>
      <h2 id="lmsHello">Your courses</h2>
      <p id="lmsSub" class="muted"></p>
    </div>
    <div id="lmsSwitch"></div>
  </div>
  <p id="status" role="status" class="family-status"></p>
  <div class="lms-dash-grid">
    <section id="lmsCourses" class="lms-cards" aria-label="Courses"></section>
    <aside class="lms-side">
      <section class="card" aria-labelledby="todoH"><h3 id="todoH">To do</h3><ul id="lmsTodo" class="lms-list"></ul></section>
      <section class="card" aria-labelledby="soonH"><h3 id="soonH">Coming up</h3><ul id="lmsSoon" class="lms-list"></ul></section>
    </aside>
  </div>
</main>
<script src="/lms.js?v=lms-2" defer></script>
<script src="/courses.js?v=lms-2" defer></script>
<script src="/account-nav.js?v=lms-2" defer></script>
<script src="/ux.js?v=ux-1" defer></script>
</body>
</html>
